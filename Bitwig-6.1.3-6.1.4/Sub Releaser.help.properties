# Sub Releaser help texts (help view, the ? overlay). Read by the framework-device-help mod from next to the
# device file; build_sub_releaser.sh copies this file there. Keys = the help ids in layouts/sub_releaser.toml.
# The knob takes its title from the parameter name; .title here is unused but kept for completeness.
# The 1 ms minimum below is M_SECONDS in nitro/sub_releaser.nitro: keep the two in step.

sub-releaser.release.title=Release Time
sub-releaser.release.desc=Set this to the release time of the synth after this device.\n\nWhen a note starts less than this time after the previous note ended, the previous note is ended this much earlier, so its release has finished before the next note begins. Notes further apart are unchanged. Overlapping notes are treated as one legato phrase and left alone. A note is never made longer, and a shortened note always keeps at least 1 ms.\n\nThe device looks ahead by delaying the notes by this time and reporting it as latency, so playback stays in time. Live input plays late by this amount.

# The scope (shader items) gets no callout in the help view (only parameter-bound items do), so its description
# lives in Scope Speed's text.
sub-releaser.speed.title=Scope Speed
sub-releaser.speed.desc=The scope above shows the incoming notes scrolling from right to left, with the present at the right edge, in time with what you hear. Orange bars are the notes as they leave the device. Red stripes mark the part of a note that was cut off, and the fading wedge after each note is the synth's release (Release Time long), which ends before the next note starts. The scope clears when the transport stops.\n\nScope Speed sets how fast it scrolls, in screens per second: at 2 Hz it shows the last 0.5 s, at 10 Hz the last 0.1 s. Higher values make short cuts easier to see. It only changes the display, not the notes.
