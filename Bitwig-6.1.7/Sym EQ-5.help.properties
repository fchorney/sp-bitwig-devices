# Sym EQ-5 help texts (help view, the ? overlay). Read by the framework-device-help mod from next to the device file;
# build_sym_eq5.sh copies this file there. Keys = the help ids in layouts/sym_eq5.toml (`help = ...`) + .title / .desc.
# Knobs and choosers take their title from the parameter name; their .title here is unused but kept for completeness.

sym-eq5.display.title=Graphical Interface
sym-eq5.display.desc=Each band is represented by a labeled circle. Click and drag to change its frequency and gain, right-click to change its mode, or scroll while hovering to adjust only the band's Q. See the window footer for other modifier options.\n\nThe two spectra show the signals chosen with Spectrum A (shaded) and Spectrum B (bright curve).\n\nBands 1 and 5 can be bells or shelves; bands 2, 3 and 4 are always bells.

sym-eq5.input_meter.title=Input Meter
sym-eq5.input_meter.desc=Level at the device input, before the Input gain

sym-eq5.output_meter.title=Output Meter
sym-eq5.output_meter.desc=Level at the device output, after the Output gain

sym-eq5.input.title=Input Gain
sym-eq5.input.desc=Gain before the EQ. The FX chain sees the change; the mirrored EQ does not undo it

sym-eq5.output.title=Output Gain
sym-eq5.output.desc=Output level of the device, after the mirrored EQ. The L button (Learn) sets it so the output is as loud as the input, measured as short-term loudness (LUFS)

sym-eq5.fx_chain.title=FX Chain
sym-eq5.fx_chain.desc=Effects placed here process the EQ'd signal; the mirrored EQ after them undoes the EQ. With an empty chain the device passes the input through unchanged. Latency of the effects is compensated

sym-eq5.learn.title=Learn Make-Up Gain
sym-eq5.learn.desc=Adjusts the gain so the output's loudness matches the input's. Loudness is measured as short-term LUFS (ITU-R BS.1770 K-weighting, 3 second window, updated every 100 ms) on the device input and on the signal before the gain; the gain becomes their difference (within ±24 dB) and keeps following it while learning. Quiet input (below -70 LUFS) holds the last value. Learning runs for 15 seconds, or until you turn it off

sym-eq5.spectrum_a.title=Spectrum A
sym-eq5.spectrum_a.desc=Signal shown as the shaded spectrum:

sym-eq5.spectrum_b.title=Spectrum B
sym-eq5.spectrum_b.desc=Signal shown as the bright curve:
